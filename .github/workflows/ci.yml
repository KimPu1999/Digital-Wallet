name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  security-events: write
jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.6
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: digital_wallet, POSTGRES_USER: ci }
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U ci -d digital_wallet"
          --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7.4.2
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', extensions: mbstring, pdo_pgsql, redis, coverage: none }
      - run: composer validate --strict
        working-directory: backend
      - run: composer install --no-interaction --prefer-dist --no-progress
        working-directory: backend
      - run: php artisan test
        working-directory: backend
      - name: Validate PostgreSQL migrations
        run: php artisan migrate --force
        working-directory: backend
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          APP_ENV: ci
          APP_DEBUG: 'false'
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: digital_wallet
          DB_USERNAME: ci
          DB_PASSWORD: ci
      - run: composer audit --no-interaction
        working-directory: backend
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.14.0', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: aquasecurity/trivy-action@0.28.0
        with: { scan-type: fs, scan-ref: '.', severity: CRITICAL,HIGH, ignore-unfixed: true, exit-code: '1' }
