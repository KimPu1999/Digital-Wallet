name: Production release approval
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Release ref
        required: true
        default: main
      confirm:
        description: Type RELEASE to build the approved artifact
        required: true
permissions: { contents: read, packages: write }
jobs:
  approved-build:
    if: ${{ inputs.confirm == 'RELEASE' }}
    runs-on: ubuntu-24.04
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.ref }}' }
      - uses: docker/setup-buildx-action@v3
      - run: docker build --file backend/Dockerfile --tag digital-wallet-api:${{ github.sha }} .
      - run: docker build --file frontend/Dockerfile --tag digital-wallet-frontend:${{ github.sha }} .
      - run: echo "Approved immutable artifact built from ${{ github.sha }}. Configure image signing and provider-specific deployment only after environment approval."
      - run: echo "No Terraform apply or production deployment is performed by this workflow."
