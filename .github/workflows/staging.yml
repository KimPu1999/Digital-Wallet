name: Staging artifact validation
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to validate
        required: true
        default: main
permissions: { contents: read, packages: write }
jobs:
  build-and-smoke:
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.ref }}' }
      - uses: docker/setup-buildx-action@v3
      - run: docker build --file backend/Dockerfile --tag digital-wallet-api:${{ github.sha }} .
      - run: docker build --file frontend/Dockerfile --tag digital-wallet-frontend:${{ github.sha }} .
      - run: docker compose config
      - run: echo "Staging artifact validated. Provider and financial execution flags remain disabled."
      - run: echo "A provider-specific deploy command must be added as a protected environment action; this workflow does not mutate cloud infrastructure."
