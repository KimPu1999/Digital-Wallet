global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: digital-wallet
    environment: ${ENVIRONMENT:-development}
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: wallet-api
    metrics_path: /metrics
    static_configs:
      - targets: ['api:8000']
  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']
  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']
